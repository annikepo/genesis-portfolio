<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Genesis Portfolio</title>

  <!-- External Styles & Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../styles/contact.css">
  <script src="../scripts/script.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a href="../index.html" class="logo">Genesis</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle Navigation">
    <i class="fas fa-bars"></i>
  </button>

  <nav class="nav" id="navMenu">
    <ul class="nav_list">
      <li><a href="../index.html">Home</a></li>
      <li><a href="../index.html">Projects</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
</header>

  <main class="contact-page">
    
    <!-- 2-Column Contact Section -->
    <section class="contact-section">
      <!-- Left Side Intro -->
      <div class="contact-info">
        <h1>Full set of great features to make your product fresh</h1>
        <p>Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
      </div>

      <!-- Right Side Form -->
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="3" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </section>

    <!-- Map Image Banner -->
    <section class="map-section">
      <img src="../images/map.jpg" alt="Broadway Triangle Map Location">
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <a href="../index.html" class="footer-logo">Genesis</a>
    <div class="footer-right">
      <ul class="footer-nav">
        <li><a href="../index.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="social-icons">
        <a href="#" aria-label="Website"><i class="fas fa-globe"></i></a>
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      </div>
    </div>
  </footer>

</body>
</html>
