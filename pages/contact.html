<!DOCTYPE html>

<head>

  <main class="main contact-page">
    <!-- Contact Intro & Reveal Action (Removed <br> tags per feedback) -->

      <h1>Full set of great features to make your product fresh</h1>

      <div class="contact-action">
        <button type="button" class="contact-btn" id="contactBtn">
          <i class="fas fa-phone-alt"></i> Show Contact Details

          <p><a href="tel:+1234567890">+1 (234) 567-8900</a></p>
          <p>hello@genesisdesign.com</p>
        </div>
      </div>
