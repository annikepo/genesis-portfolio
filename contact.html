<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis | Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Genesis</a>
    <nav class="nav">
      <ul class="nav_list">
        <li><a href="index.html">Home</a></li>
        <li><a href="project.html">Project Details</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="main contact-page">
  <!-- Contact Intro & Reveal Action -->
  <section class="contact-intro">
    <h1>Full set of great<br>features to make your<br>product fresh</h1>
    
    <div class="contact-action">
      <button type="button" class="contact-btn" id="contactBtn" onclick="revealPhoneNumber()">
        <i class="fas fa-phone-alt"></i> Show Contact Details
      </button>

      <div class="phone-number" id="phoneNumber" style="display: none;">
        <a href="tel:+1234567890">+1 (234) 567-8900</a>
        <p>hello@genesisdesign.com</p>
      </div>
    </div>
  </section>

  <!-- Location Map Graphic -->
  <section class="map-section">
    <img src="images/Map.jpg" alt="Location Map">
  </section>
</main>

<script>
  function revealPhoneNumber() {
    const btn = document.getElementById('contactBtn');
    const phone = document.getElementById('phoneNumber');
    
    btn.style.display = 'none';
    phone.style.display = 'block';
  }
</script>

 <footer class="footer">
  <a href="index.html" class="footer-logo">Genesis</a>

  <div class="footer-right">
    <nav class="footer-nav">
      <a href="project.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="social-icons">
      <a href="#" aria-label="Website"><i class="fas fa-globe"></i></a>
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
    </div>
  </div>
</footer>
